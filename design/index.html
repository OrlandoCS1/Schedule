<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.13.1/font/bootstrap-icons.min.css">


    <title>Document</title>
</head>
<body>
    <header>
        <nav>
            <span class = "logo_container">
                <i class="bi bi-arrow-through-heart-fill"></i>
                <p>WeekFlow</p>
                
            </span> 
            <div class = "title">
                <p id = "period">2026</p>
                <strong><p id = "couple_name">Orly & Bibí Schedule</p></strong>
            </div>

            <div class="slider">
                <div class="week_btn">
                    <p>Week</p>
                </div>
                <div class="day_btn">
                    <p>Day</p>
                </div>
            </div>

        </nav>

        <div class="controls">
            <div id = "add_btn">
                <p>Add</p>
            </div>
            <div class = "add_form">
               
            </div>  
        </div>

        </div>
        <main id="week_container">
            <div class = "corner"></div>
        </main>
       
    </header>
    <div class = "modalOff" id = "modal">
        <form action="" method="post" class = "addForm">
            <div class = "title_cancel">
                <h1>New Event</h1>
                <div id = "close_modal_btn">
                    <i class="bi bi-x"></i>
                </div>
            </div>
            
            <div class = "separator">
                <label for="title_event">Title *</label>
                <input type="text" maxlength="20" id="title" class = "inputs" name="title_event">
            </div>

            <div class = "separator">
                <label for="notes">Notes</label>
                <input type="text" maxlength="50" id="notes" class = "inputs" name = "notes">
            </div>

            <div class = "separator">
                <label for="Category">Category *</label>
               
                <select id = "category_opts">
                    <option value="School" data-color='#635AE4'>School</option>
                    <option value="Study" data-color='#F86563'>Study</option>
                    <option value="Tasks" data-color='#09BE8B'>Tasks</option>
                    <option value="Couple" data-color='#DCA60E'>Couple</option>
                </select>
            </div>

            <div class = "separator">
                <label for="Category">Day *</label>
                
                <select id = "days">
                    <option value="mon">Monday</option>
                    <option value="tue">Tuesday</option>
                    <option value="wed">Wednesday</option>
                    <option value="thu">Thursday</option>
                    <option value="fri">Friday</option>
                    <option value="sat">Saturday</option>
                    <option value="sun">Sunday</option>
                </select>
            </div>



            <div class = "num_separator">
                <div class="separator">
                    <label for="start">Starts: *</label>
                    <input type="hidden" name = "startHour" id = "hidden_start">
                   
                    <select id = "hours_data_start">   
                    </select>
                </div>
                
                <div class="separator">
                    <label for="end">Ends: *</label>
                    
                    <select id = "hours_data_end">  
                    </select>
                </div>
                
            </div>

            

            <button type="button" id = "btn_submit">
                Add to Schedule
            </button>

        </form>
    </div>
</body>

<script src="week_script.js"></script>
<script src="add.js"></script>
<script src="loadSchedule.js"></script>
</html>
